services:
  - type: web
    name: follow-up-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: SECRET_KEY
        generateValue: true
